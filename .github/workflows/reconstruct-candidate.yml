name: Valkyrie reconstruction candidate
on:
  push:
    paths:
      - 'tools/reconstruct_candidate.py'
      - '.github/workflows/reconstruct-candidate.yml'
  workflow_dispatch:
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy open3d
      - run: python tools/reconstruct_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: valkyrie-reconstruction-test
          path: |
            valkyrie-candidate.ply
            reconstruction-report.json
