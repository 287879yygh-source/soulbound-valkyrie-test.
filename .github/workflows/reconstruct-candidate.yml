name: Valkyrie reconstruction candidate
on:
  push:
    paths:
      - 'tools/reconstruct_candidate.py'
      - '.github/workflows/reconstruct-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0
      - run: pip install numpy open3d matplotlib trimesh
      - run: |
          python -u tools/reconstruct_candidate.py > reconstruction-log.txt 2>&1 || { cat reconstruction-log.txt; exit 1; }
      - run: cat reconstruction-log.txt
      - run: |
          python - <<'PY'
          import trimesh
          from pathlib import Path
          p=Path('valkyrie-main-surface.ply')
          if not p.exists():
              raise FileNotFoundError('Reconstruction did not produce valkyrie-main-surface.ply')
          m=trimesh.load(str(p),force='mesh',process=False)
          m.export('valkyrie-preview.glb')
          print('Preview GLB:',len(m.vertices),'vertices',len(m.faces),'faces')
          PY
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reconstruction-log.txt
          git add -f valkyrie-preview.glb || true
          git status --short
          git add -f valkyrie-*-mesh-preview.png || true
          git add -f reconstruction-report.json || true
          git commit -m 'Save reconstruction result' || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: valkyrie-reconstruction-test
          path: |
            valkyrie-preview.glb
            valkyrie-candidate.ply
            valkyrie-main-surface.ply
            valkyrie-repair-experiment.ply
            valkyrie-oriented-experiment.ply
            valkyrie-*-mesh-preview.png
            reconstruction-report.json
