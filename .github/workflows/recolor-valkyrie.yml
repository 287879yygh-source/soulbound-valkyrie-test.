name: Recolor Valkyrie preview
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recolor-valkyrie.yml'
permissions:
  contents: write
jobs:
  recolor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy trimesh pillow
      - run: |
          python - <<'PY'
          import trimesh, numpy as np
          from scipy.spatial import cKDTree
          target=trimesh.load('valkyrie-preview.glb',force='mesh',process=False)
          scene=trimesh.load('valkyrie.glb',force='scene',process=False)
          xyz=[];colors=[]
          for node in scene.graph.nodes_geometry:
              transform,name=scene.graph[node]
              geom=scene.geometry[name]
              if len(geom.vertices)<10000: continue
              rgba=np.asarray(geom.visual.to_color().vertex_colors)
              if len(rgba)!=len(geom.vertices): continue
              xyz.append(trimesh.transform_points(geom.vertices,transform))
              colors.append(rgba)
          if not xyz: raise RuntimeError('Original body colors unavailable')
          d,ids=cKDTree(np.concatenate(xyz)).query(target.vertices,k=1)
          target.visual=trimesh.visual.ColorVisuals(mesh=target,vertex_colors=np.concatenate(colors)[ids])
          target.export('valkyrie-preview.glb')
          print('Saved',len(target.vertices),'vertices, mean source distance',float(d.mean()))
          PY
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f valkyrie-preview.glb
          git commit -m 'Apply source Valkyrie colors to preview'
          git pull --rebase
          git push
