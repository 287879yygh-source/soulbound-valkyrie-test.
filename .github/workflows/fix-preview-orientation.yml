name: Valkyrie preview orientation fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/reconstruct_candidate.py')
          s=p.read_text()
          s=s.replace('ax.view_init(elev=5,azim=azimuth)', 'ax.view_init(elev=5,azim=azimuth-90)')
          p.write_text(s)
          PY
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add tools/reconstruct_candidate.py
          git commit -m 'Correct preview camera orientation' || true
          git push
