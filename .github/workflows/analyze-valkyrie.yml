name: Analyze Azure Valkyrie GLB
on:
  push:
    paths:
      - '.github/workflows/analyze-valkyrie.yml'
      - 'tools/analyze_valkyrie.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Inspect original binary
        run: python tools/analyze_valkyrie.py > valkyrie-analysis.txt 2>&1 || echo 'Inspection failed; see report' >> valkyrie-analysis.txt
      - name: Commit diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add valkyrie-analysis.txt
          git commit -m 'Record Azure Valkyrie binary diagnostics' || exit 0
          git push
