name: Analyze Azure Valkyrie GLB
on:
  push:
    paths:
      - '.github/workflows/analyze-valkyrie.yml'
      - 'tools/analyze_valkyrie.py'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python tools/analyze_valkyrie.py
