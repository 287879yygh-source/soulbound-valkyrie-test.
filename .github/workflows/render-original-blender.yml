name: Render original Valkyrie in Blender
on:
  push:
    paths:
      - 'tools/render_original_blender.py'
      - '.github/workflows/render-original-blender.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y blender
      - run: |
          blender -b -t 2 --python tools/render_original_blender.py > blender-original-log.txt 2>&1 || echo 'BLENDER_FAILED' >> blender-original-log.txt
      - run: tail -n 50 blender-original-log.txt
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f blender-original-log.txt
          if test -f blender-original-valkyrie.png; then git add -f blender-original-valkyrie.png; fi
          git commit -m 'Save original Valkyrie Blender render' || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: original-valkyrie-blender-render
          path: |
            blender-original-valkyrie.png
            blender-original-log.txt
