<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Azure Valkyrie – Soulbound</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><style>html,body{margin:0;height:100%;overflow:hidden;background:#101726;color:white;font:14px system-ui}canvas{display:block}#top{position:absolute;top:10px;left:12px;right:12px;text-shadow:0 1px 4px black}#controls{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:10px;right:10px;padding:12px;max-height:38vh;overflow-y:auto;box-sizing:border-box;background:#18243aeb;border:1px solid #405270;border-radius:14px;display:grid;gap:10px}button,select{background:#344d76;color:white;border:1px solid #6782aa;border-radius:9px;padding:11px;font-size:14px}button{min-height:44px}#buttons{display:flex;gap:8px;min-width:0}#buttons button{min-width:0;padding:8px 3px}#diagnostic{display:block;overflow-wrap:anywhere;font-size:11px;max-height:72px;overflow:auto}#scrub{box-sizing:border-box;min-width:0}#buttons button{flex:1}input{width:100%}</style></head><body><div id="top"><b>AZURE VALKYRIE · SOULBOUND</b> <a style="color:#9dd9ff;margin-left:10px" href="?model=probe">Testa 3D-kedjan</a><p id="status">Laddar modell…</p></div><div id="controls"><label>Animationstid: <span id="time">0,00 s</span></label><input id="scrub" type="range" min="0" max="1" step=".001" value="0"><div id="buttons"><button id="play">Pausa</button><button id="reset">Starta om</button><button id="rotate">Rotera</button></div><label>Hastighet <select id="speed"><option value=".5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option></select></label><label>Pose <select id="pose"><option value="animated">Animation</option><option value="bind">Bindpose (utan animation)</option></select></label><label>Visning <select id="view"><option value="original">Original</option><option value="solid">Solid diagnostik</option><option value="wire">Triangelnät</option></select></label><small id="diagnostic">Kontrollerar mesh…</small><small>Dra på figuren för att vrida kameran. Nyp för att zooma.</small></div><script type="module">import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const $=x=>document.getElementById(x);const scene=new T.Scene();scene.background=new T.Color('#101726');scene.add(new T.HemisphereLight(0xffffff,0x647ba4,2.4));const light=new T.DirectionalLight(0xffffff,2);light.position.set(3,5,4);scene.add(light);const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.01,200);camera.position.set(2,1,4);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;document.body.prepend(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;let mixer,clip,playing=true,elapsed=0;let inspected=[];let bindPose=false;const clock=new T.Clock();const choice=new URLSearchParams(location.search).get('model');const source=choice==='probe'?'./pipeline-probe.glb':'./valkyrie.glb';new GLTFLoader().load(source,g=>{const model=g.scene;scene.add(model);model.updateMatrixWorld(true);const box=new T.Box3().setFromObject(model);const size=box.getSize(new T.Vector3());const center=box.getCenter(new T.Vector3());model.position.sub(center);const dist=Math.max(size.x,size.y,size.z,1)*1.8;camera.position.set(dist*.45,dist*.2,dist);camera.far=dist*25;camera.updateProjectionMatrix();orbit.target.set(0,0,0);orbit.update();let skins=0;model.traverse(x=>{if(x.isMesh){if(x.isSkinnedMesh)skins++;x.frustumCulled=false;const geo=x.geometry;const pos=geo?.getAttribute('position');const idx=geo?.index;inspected.push({mesh:x,original:x.material,vertices:pos?.count||0,triangles:idx?idx.count/3:(pos?.count||0)/3,skin:x.isSkinnedMesh,materials:(Array.isArray(x.material)?x.material:[x.material]).map(m=>({name:m?.name,transparent:m?.transparent,opacity:m?.opacity,side:m?.side,depthWrite:m?.depthWrite}))})}});$('diagnostic').textContent=inspected.map((v,i)=>'Mesh '+(i+1)+': '+v.vertices+' hörn, '+Math.round(v.triangles)+' trianglar, skin='+v.skin+', material='+JSON.stringify(v.materials)).join(' | ');clip=g.animations[0];if(clip){mixer=new T.AnimationMixer(model);mixer.clipAction(clip).play();$('scrub').max=clip.duration} $('status').textContent=(source.includes('probe')?'TESTTRIANGEL (inte Azure Valkyrie)':'Azure Valkyrie')+' · '+skins+' skinnade mesh · '+g.animations.length+' animationer';},undefined,e=>{$('status').innerHTML='Azure Valkyrie saknas ännu i publiceringen. <a style="color:#9dd9ff" href="?model=probe">Visa fungerande GLB-test i stället</a>. Fel: '+e.message});$('pose').onchange=()=>{bindPose=$('pose').value==='bind';if(bindPose){playing=false;$('play').textContent='Spela';if(mixer)mixer.stopAllAction();modelPose();}else{if(mixer&&clip){mixer.stopAllAction();mixer.clipAction(clip).reset().play();mixer.setTime(elapsed);}playing=true;$('play').textContent='Pausa';}};function modelPose(){for(const v of inspected)if(v.mesh.isSkinnedMesh)v.mesh.skeleton.pose();} $('view').onchange=()=>{for(const v of inspected){if(v.mesh.material!==v.original){(Array.isArray(v.mesh.material)?v.mesh.material:[v.mesh.material]).forEach(m=>m.dispose());}if($('view').value==='original'){v.mesh.material=v.original;}else{const make=()=>new T.MeshNormalMaterial({side:T.DoubleSide,wireframe:$('view').value==='wire',skinning:true});v.mesh.material=Array.isArray(v.original)?v.original.map(make):make();}}};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pausa':'Spela'};$('reset').onclick=()=>{elapsed=0;if(mixer)mixer.setTime(0)};$('rotate').onclick=()=>{orbit.autoRotate=!orbit.autoRotate};$('scrub').oninput=()=>{playing=false;$('play').textContent='Spela';elapsed=Number($('scrub').value);if(mixer&&!bindPose)mixer.setTime(elapsed)};function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(mixer&&clip&&playing&&!bindPose){const d=dt*Number($('speed').value);mixer.update(d);elapsed=(elapsed+d)%clip.duration;$('scrub').value=elapsed}$('time').textContent=elapsed.toFixed(2).replace('.',',')+' s';orbit.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
